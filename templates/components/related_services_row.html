{% load i18n static %}

<!-- RELATED SERVICES ROW -->
<div class="related-services-wrapper mt-5 pt-4 border-top">
  <div class="cf-eyebrow-badge mb-2">
    {% trans "EXPLORE MORE" %}
  </div>
  <h3 class="fw-bold mb-4 text-navy" style="font-family: var(--cf-font-head, 'Outfit', sans-serif); color: #0B2545; font-size: 1.45rem;">
    {% trans "Related Dental Treatments" %}
  </h3>
  <div class="row g-4">
    {% for rel_service in related_services %}
    <div class="col-lg-4 col-md-6 col-12">
      {% include 'components/service_card.html' with service=rel_service %}
    </div>
    {% empty %}
    <div class="col-12">
      <p class="text-muted small">{% trans "No related services found." %}</p>
    </div>
    {% endfor %}
  </div>
</div>
