{% load static i18n form_tags %}

<style>
  /* ── Full-Width Background Dental Operatory Appointment Section ── */
  .cf-operatory-appointment-section {
    position: relative;
    background-image: url("{% static 'images/carefirst_clinic_operatory_treatment.jpg' %}");
    background-size: cover;
    background-position: center left;
    background-repeat: no-repeat;
    min-height: 640px;
    padding: 75px 0;
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* Gradient Overlay: Soft on Left to showcase the clinic chair, clean white-wash on Right for the form */
  .cf-operatory-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      rgba(255, 255, 255, 0.15) 0%,
      rgba(255, 255, 255, 0.55) 35%,
      rgba(255, 255, 255, 0.92) 55%,
      rgba(255, 255, 255, 0.98) 100%
    );
    pointer-events: none;
    z-index: 1;
  }

  .cf-operatory-container {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  /* Form Container on the Right Side */
  .cf-app-form-wrap {
    padding: 10px;
  }

  .cf-app-badge-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(2, 132, 199, 0.1);
    color: #0284C7;
    border: 1px solid rgba(2, 132, 199, 0.25);
    padding: 4px 14px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .cf-app-heading {
    font-family: var(--cf-font-head, 'Outfit', sans-serif);
    font-size: clamp(1.85rem, 2.5vw, 2.35rem);
    font-weight: 800;
    color: #0B2545;
    line-height: 1.2;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .cf-app-sub {
    font-size: 1rem;
    color: #64748B;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  /* Form Labels & Inputs Matching Clean Reference */
  .cf-app-label {
    font-family: var(--cf-font-body, 'Inter', sans-serif);
    font-size: 0.88rem;
    font-weight: 600;
    color: #1E293B;
    margin-bottom: 6px;
    display: block;
  }

  .cf-app-label .required-star {
    color: #0284C7;
    font-weight: 700;
  }

  .cf-app-input {
    background: #FFFFFF !important;
    border: 1.5px solid #E2E8F0 !important;
    border-radius: 10px !important;
    padding: 12px 16px !important;
    font-size: 0.92rem !important;
    color: #0F172A !important;
    transition: all 0.2s ease !important;
    box-shadow: 0 2px 6px rgba(11, 37, 69, 0.02) !important;
    width: 100%;
  }

  .cf-app-input::placeholder {
    color: #94A3B8 !important;
    font-size: 0.9rem;
  }

  .cf-app-input:focus {
    border-color: #0284C7 !important;
    box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12) !important;
    outline: none !important;
    background: #FFFFFF !important;
  }

  textarea.cf-app-input {
    min-height: 110px;
    resize: vertical;
  }

  /* Submit Button Matching Brand Primary System */
  .cf-app-submit-btn {
    background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%) !important;
    color: #FFFFFF !important;
    font-family: var(--cf-font-nav, 'Plus Jakarta Sans', sans-serif);
    font-weight: 700;
    font-size: 0.98rem;
    padding: 13px 34px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(2, 132, 199, 0.35);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none !important;
  }

  .cf-app-submit-btn:hover {
    background: linear-gradient(135deg, #0369A1 0%, #075985 100%) !important;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(2, 132, 199, 0.45);
    color: #FFFFFF !important;
  }

  .cf-app-submit-btn:active {
    transform: translateY(0);
  }

  @media (max-width: 991.98px) {
    .cf-operatory-appointment-section {
      background-position: center center;
      padding: 50px 0;
    }
    .cf-operatory-overlay {
      background: rgba(255, 255, 255, 0.95);
    }
    .cf-app-heading {
      font-size: 1.9rem;
    }
    .cf-app-submit-btn {
      width: 100%;
    }
  }
</style>

<!-- ── Background Dental Operatory Appointment Section ── -->
<section class="cf-operatory-appointment-section" id="cfAppointmentBooking">
  <div class="cf-operatory-overlay"></div>

  <div class="container cf-operatory-container">
    <div class="row justify-content-end">
      
      <!-- Right Form Column (Spanning Right 7 to 8 Columns) -->
      <div class="col-lg-7 col-xl-7 col-md-12">
        <div class="cf-app-form-wrap">
          
          <div class="cf-app-badge-tag">
            <i class="bi bi-calendar2-check-fill"></i> {% trans "Appointment Desk" %}
          </div>
          <h2 class="cf-app-heading">{% trans "Schedule Your Smile Visit" %}</h2>
          <p class="cf-app-sub">{% trans "Request an appointment with our specialist dental team in Shankhamul, Kathmandu." %}</p>

          <form action="{% url 'appointments:book' %}" method="POST" id="cfDirectAppointmentForm">
            {% csrf_token %}
            <input type="hidden" name="form_type" value="appointment">
            <input type="hidden" name="appointment_type" value="consultation">

            <div class="row g-3">
              
              <!-- Row 1: Name & Email -->
              <div class="col-md-6">
                <label class="cf-app-label" for="appFullName">
                  {% trans "Your Name" %} <span class="required-star">*</span>
                </label>
                <input type="text" name="full_name" id="appFullName" class="cf-app-input" placeholder="{% trans 'Full Name' %}" required autocomplete="name">
              </div>

              <div class="col-md-6">
                <label class="cf-app-label" for="appEmail">
                  {% trans "Your Email Address" %} <span class="required-star">*</span>
                </label>
                <input type="email" name="email" id="appEmail" class="cf-app-input" placeholder="{% trans 'Email' %}" required autocomplete="email">
              </div>

              <!-- Row 2: Contact Number & Appointment Date -->
              <div class="col-md-6">
                <label class="cf-app-label" for="appPhone">
                  {% trans "Contact Number" %} <span class="required-star">*</span>
                </label>
                <input type="tel" name="phone" id="appPhone" class="cf-app-input" placeholder="{% trans 'Phone' %}" required autocomplete="tel">
              </div>

              <div class="col-md-6">
                <label class="cf-app-label" for="appDate">
                  {% trans "Appointment date" %} <span class="required-star">*</span>
                </label>
                <div class="position-relative">
                  <input type="date" name="preferred_date" id="appDate" class="cf-app-input pe-5" placeholder="{% trans 'Requested Date' %}" required>
                </div>
              </div>

              <!-- Row 3: Treatment Selection (Optional/Smart) & Preferred Time -->
              <div class="col-md-6">
                <label class="cf-app-label" for="appTreatment">
                  {% trans "Treatment / Service" %}
                </label>
                <select name="treatment" id="appTreatment" class="cf-app-input form-select">
                  <option value="general-consultation" selected>{% trans "General Dental Check-up & Consultation" %}</option>
                  {% for s in services %}
                  <option value="{{ s.slug }}">{{ s.title }}</option>
                  {% empty %}
                  <option value="root-canal-treatment">{% trans "Root Canal Treatment (RCT)" %}</option>
                  <option value="dental-implants">{% trans "Dental Implants" %}</option>
                  <option value="teeth-whitening">{% trans "Cosmetic Teeth Whitening" %}</option>
                  <option value="braces-orthodontics">{% trans "Orthodontics & Braces" %}</option>
                  <option value="tooth-extraction">{% trans "Tooth Extraction" %}</option>
                  <option value="dental-fillings">{% trans "Tooth Fillings & Restoration" %}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-6">
                <label class="cf-app-label" for="appTime">
                  {% trans "Preferred Time" %}
                </label>
                <select name="preferred_time" id="appTime" class="cf-app-input form-select">
                  <option value="morning">{% trans "Morning (7:30 AM – 11:30 AM)" %}</option>
                  <option value="afternoon" selected>{% trans "Afternoon (11:30 AM – 4:00 PM)" %}</option>
                  <option value="evening">{% trans "Evening (4:00 PM – 7:30 PM)" %}</option>
                </select>
              </div>

              <!-- Row 4: Message -->
              <div class="col-12">
                <label class="cf-app-label" for="appMessage">
                  {% trans "Message" %}
                </label>
                <textarea name="message" id="appMessage" class="cf-app-input" rows="3" placeholder="{% trans 'Your message' %}"></textarea>
              </div>

              <!-- Row 5: Action Button -->
              <div class="col-12 pt-2">
                <button type="submit" class="cf-app-submit-btn" id="cfAppSubmitBtn">
                  {% trans "Book Appointment Now" %}
                </button>
              </div>

            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</section>

<script>
  // Set minimum date to today/tomorrow
  document.addEventListener('DOMContentLoaded', function() {
    const dateInput = document.getElementById('appDate');
    if (dateInput) {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      dateInput.min = `${yyyy}-${mm}-${dd}`;
      if (!dateInput.value) {
        const tomorrow = new Date(Date.now() + 86400000);
        const tYyyy = tomorrow.getFullYear();
        const tMm = String(tomorrow.getMonth() + 1).padStart(2, '0');
        const tDd = String(tomorrow.getDate()).padStart(2, '0');
        dateInput.value = `${tYyyy}-${tMm}-${tDd}`;
      }
    }
  });
</script>
