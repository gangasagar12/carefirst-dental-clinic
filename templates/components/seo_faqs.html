{% load static %}
{% if faqs %}
<!-- SEO FAQs Section -->
<section class="section-py position-relative mt-5 mb-5" style="background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.9)), url('{% static "images/rct_feat_digital.png" %}'); background-size: cover; background-position: center; background-attachment: fixed; border-radius: 20px;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="text-center mb-5">
                    <h2 class="section-heading fw-bolder text-dark" style="font-family: var(--cf-font-head); color: var(--cf-primary-dark);">Frequently Asked Questions</h2>
                </div>
                <div class="accordion" id="faqAccordion">
                    {% for faq in faqs %}
                    <div class="accordion-item border-0 shadow-sm mb-3 rounded-4 overflow-hidden">
                        <h3 class="accordion-header" id="heading{{ faq.id }}">
                            <button class="accordion-button collapsed bg-white text-dark fw-bold p-4" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ faq.id }}" aria-expanded="false" aria-controls="collapse{{ faq.id }}">
                                <i class="bi bi-question-circle me-3 fs-4" style="color: var(--cf-primary);"></i> {{ faq.question }}
                            </button>
                        </h3>
                        <div id="collapse{{ faq.id }}" class="accordion-collapse collapse" aria-labelledby="heading{{ faq.id }}" data-bs-parent="#faqAccordion">
                            <div class="accordion-body bg-white text-muted px-5 pb-4 pt-0" style="font-size: 1.05rem; line-height: 1.6;">
                                {{ faq.answer|safe }}
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>

<!-- FAQ Schema.org JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for faq in faqs %}
    {
      "@type": "Question",
      "name": "{{ faq.question|escapejs }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ faq.answer|striptags|escapejs }}"
      }
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
  ]
}
</script>
{% endif %}
