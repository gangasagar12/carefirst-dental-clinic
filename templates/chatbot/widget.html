{% load static i18n %}

<!-- Floating CareFirst AI Assistant Container (Left Aligned) -->
<div class="cf-chat-launcher-container" id="cfChatLauncherContainer">
  
  <!-- Proactive Context Speech Bubble (Optional) -->
  <div class="cf-chat-callout" id="cfChatCallout" style="display: none;">
    <div class="cf-chat-callout-content" onclick="window.careFirstChat && window.careFirstChat.open ? window.careFirstChat.open() : document.getElementById('cfChatPanel').classList.add('active')">
      <span class="cf-callout-wave" id="cfCalloutIcon">👋</span>
      <span id="cfCalloutMsg">{% trans "Have questions about dental care or pricing?" %} <strong>{% trans "Ask here!" %}</strong></span>
    </div>
    <button class="cf-chat-callout-close" id="cfCalloutClose" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Floating Context-Aware AI Receptionist Launcher -->
  <div class="cf-chat-launcher" id="cfChatLauncher" role="button" tabindex="0" aria-label="Open CareFirst Dental Assistant">
    <div class="cf-launcher-ripple"></div>
    <div class="cf-chat-launcher-badge">
      <span class="cf-launcher-icon-emoji" id="cfLauncherEmoji">👋</span>
    </div>
    <div class="cf-chat-launcher-text" id="cfLauncherTextWrapper">
      <span class="cf-launcher-dynamic-title" id="cfLauncherTitle">{% trans "Need dental help?" %}</span>
      <span class="cf-launcher-dynamic-sub" id="cfLauncherSub">{% trans "CareFirst AI • Online" %}</span>
    </div>
  </div>

</div>

<!-- Chatbot Window Panel (Left Aligned) -->
<div class="cf-chat-panel cf-chat-panel-left" id="cfChatPanel" aria-hidden="true">
  
  <!-- Header -->
  <div class="cf-chat-header">
    <div class="cf-chat-header-brand">
      <div class="cf-chat-avatar">
        <img src="{% static 'main/img/care-first-logo.jpeg' %}" alt="CareFirst Logo">
      </div>
      <div>
        <h3 class="cf-chat-header-title">Care<span style="color:#38BDF8;">First</span> Assistant</h3>
        <div class="cf-chat-header-subtitle">
          <span class="cf-chat-status-dot"></span>
          <span>{% trans "Online • Verified Care Guidance" %}</span>
        </div>
      </div>
    </div>
    <div class="cf-chat-header-actions">
      <button class="cf-chat-header-btn" id="cfChatClose" aria-label="Close Assistant">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <!-- Messages Body -->
  <div class="cf-chat-body" id="cfChatBody">
    <!-- Messages & interactive cards dynamically appended via chatbot.js -->
  </div>

  <!-- Typing Indicator -->
  <div class="px-3 pb-2 bg-light" id="cfChatTyping" style="display: none;">
    <div class="cf-chat-typing">
      <div class="cf-chat-dot"></div>
      <div class="cf-chat-dot"></div>
      <div class="cf-chat-dot"></div>
    </div>
  </div>

  <!-- Quick Action Chips -->
  <div class="cf-chat-quick-actions" id="cfChatQuickActions" style="display: none;">
    <!-- Action buttons populated dynamically -->
  </div>

  <!-- Footer Input Bar -->
  <div class="cf-chat-footer">
    <div class="cf-chat-input-wrap">
      <input type="text" id="cfChatInput" class="cf-chat-input" placeholder="{% trans 'Ask about treatments, price, appointments...' %}" maxlength="2000" autocomplete="off">
      <button class="cf-chat-send-btn" id="cfChatSend" aria-label="Send Message">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
  </div>

</div>

<script>
  (function() {
    function initDirectLauncher() {
      const launcher = document.getElementById('cfChatLauncher');
      const panel = document.getElementById('cfChatPanel');
      const closeBtn = document.getElementById('cfChatClose');
      if (launcher && panel) {
        launcher.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          const willOpen = !panel.classList.contains('active');
          if (willOpen) {
            panel.classList.add('active');
            launcher.classList.add('is-open');
            if (window.careFirstChat && typeof window.careFirstChat.open === 'function') {
              window.careFirstChat.open();
            }
          } else {
            panel.classList.remove('active');
            launcher.classList.remove('is-open');
          }
        };
      }
      if (closeBtn && panel) {
        closeBtn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          panel.classList.remove('active');
          if (launcher) launcher.classList.remove('is-open');
        };
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDirectLauncher);
    } else {
      initDirectLauncher();
    }
  })();
</script>
