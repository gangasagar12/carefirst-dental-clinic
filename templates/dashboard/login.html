{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff Login — CareFirst Dental Clinic</title>
  <link rel="icon" type="image/jpeg" href="{% static 'main/img/care-first-logo.jpeg' %}">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #051426 0%, #081D36 50%, #051426 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-avatar {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.3);
      border: 2px solid #38BDF8;
    }
    .login-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      color: #0B2545;
      text-align: center;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 0.88rem;
      color: #64748B;
      text-align: center;
      margin-bottom: 28px;
    }
    .form-control {
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.95rem;
      border: 1.5px solid #E2E8F0;
    }
    .form-control:focus {
      border-color: #0284C7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
      color: #FFFFFF;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 20px;
      width: 100%;
      border: none;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
      transition: all 0.25s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #0369A1 0%, #075985 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.45);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="{% static 'main/img/care-first-logo.jpeg' %}" alt="Clinic Logo" class="brand-avatar">
    <h2 class="login-title">CareFirst Dental Clinic</h2>
    <p class="login-subtitle">Executive Staff & Clinic Dashboard</p>

    {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} rounded-3 small py-2 px-3 mb-3">
        {{ message }}
      </div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'dashboard:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold small text-muted">Username / Staff ID</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"></span>
          <input type="text" name="username" class="form-control border-start-0" placeholder="Enter username" style="border-radius: 0 12px 12px 0;" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold small text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;"></span>
          <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" style="border-radius: 0 12px 12px 0;" required>
        </div>
      </div>

      <button type="submit" class="btn btn-login mb-3">
         Sign In to Dashboard
      </button>

      <div class="text-center">
        <a href="{% url 'main:home' %}" class="small text-decoration-none text-muted">
           Return to Main Website
        </a>
      </div>
    </form>
  </div>

</body>
</html>
