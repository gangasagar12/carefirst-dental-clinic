{% load static %}
<section class="treatments-hero position-relative d-flex align-items-center bg-white overflow-hidden" style="padding-top: 120px; padding-bottom: 60px;">
    <div class="container position-relative z-1">
        <div class="row align-items-center g-5">
            <!-- Left: Text -->
            <div class="col-lg-5 pe-lg-5">
                <span class="badge bg-primary-light text-primary px-4 py-2 rounded-pill mb-4 fw-bold tracking-wide" style="font-size: 0.85rem;">
                    OUR TREATMENTS
                </span>
                
                <h1 class="editorial-heading h1 text-navy mb-4 fade-up">
                    Complete Dental Care for <strong class="text-primary">Every Smile</strong>
                </h1>
                
                <p class="text-secondary-brand mb-5 fade-up" style="animation-delay: 0.1s; font-weight: 300; line-height: 1.7;">
                    Discover preventive, restorative, cosmetic, and advanced dental treatments designed around your comfort, confidence, and long-term oral health.
                </p>
                
                <div class="d-flex flex-wrap gap-3 fade-up" style="animation-delay: 0.2s;">
                    <a href="{% url 'appointment' %}" class="btn btn-primary px-5 py-3 rounded-pill fw-semibold shadow-sm transition-smooth hover-lift">Book Appointment</a>
                    <a href="tel:+9779807464136" class="btn btn-outline-primary px-5 py-3 rounded-pill fw-semibold bg-white transition-smooth hover-lift">Call Clinic</a>
                </div>
            </div>
            
            <!-- Right: Image with Overlay Text -->
            <div class="col-lg-7 position-relative fade-up" style="animation-delay: 0.3s;">
                <div class="position-relative ms-lg-4 hover-zoom-img rounded-4 shadow-sm" style="height: 650px;">
                    <img src="{% static 'serices-image/hero_bg.png' %}" alt="Premium Dental Care" class="img-fluid w-100 h-100 object-fit-cover">
                    
                    <!-- Text Overlay -->
                    <div class="hero-image-overlay-text">
                        <h4 class="h5 fw-bold text-navy mb-1" style="letter-spacing: -0.5px;">Gentle Care.</h4>
                        <h4 class="h5 fw-bold text-primary mb-0" style="letter-spacing: -0.5px;">Beautiful Results.</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
